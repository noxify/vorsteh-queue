type FlowEntry {
  flowId: String
  rootJob: Job
}

type FlowNode {
  children: [FlowNode!]
  job: Job
}

type Job {
  attempts: Int
  cancellationReason: String
  cancelledAt: String
  completedAt: String
  createdAt: String
  cron: String
  error: SerializedError
  failedAt: String
  groupKey: String
  id: ID
  maxAttempts: Int
  name: String
  payload: String
  priority: Int
  processAt: String
  processedAt: String
  progress: Int
  result: String
  status: JobStatus
  uniqueKey: String
}

enum JobStatus {
  cancelled
  completed
  dead
  delayed
  failed
  pending
  processing
  waiting_children
}

type Mutation {
  cancelJob(id: ID!, reason: String): Boolean
  clearJobs(status: JobStatus): Int
  deleteJob(id: ID!): Boolean
  redriveAll(name: String): Int
  redriveJob(id: ID!): Boolean
  retryJob(id: ID!): Boolean
  runJobNow(id: ID!): Boolean
}

type Query {
  deadJobs(limit: Int, offset: Int): [Job!]
  flowTree(flowId: String!): FlowNode
  flows(limit: Int, offset: Int): [FlowEntry!]
  job(id: ID!): Job
  jobs(limit: Int, name: String, offset: Int, status: JobStatus): [Job!]
  size: Int
  stats: QueueStats
}

type QueueStats {
  cancelled: Int
  completed: Int
  dead: Int
  delayed: Int
  failed: Int
  pending: Int
  processing: Int
}

type SerializedError {
  message: String
  name: String
  stack: String
}

type Subscription {
  jobStatusChanged: Job
  statsUpdated: QueueStats
}
